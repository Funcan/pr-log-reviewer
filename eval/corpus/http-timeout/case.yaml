kind: commit
conventional: false
messages:
  - text: |
      Add a configurable request timeout to the API client

      The HTTP client was created with no timeout, so a hung upstream
      connection could block a caller indefinitely. New now takes a timeout
      argument and defaults to 30s when it is zero, bounding every request
      while still letting callers tune it.
