kind: commit
conventional: false
messages:
  - text: |
      Return an error from Divide on division by zero

      Divide previously returned +Inf (or NaN for 0/0) when called with a
      zero divisor, silently propagating a meaningless result to callers.
      Change the signature to (float64, error) and return an explicit error
      so callers must handle the invalid case. Add a regression test that
      asserts the error is returned for x/0.
    quality: good

